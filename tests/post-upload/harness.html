<!doctype html><html><body><button id="start">Upload fixture</button><p id="status">Ready</p><script type="module">
import { supabase } from '/src/integrations/supabase/client.ts';
import { uploadPostFile } from '/src/lib/post-upload.ts';
supabase.auth.getSession = async () => ({ data: { session: { access_token: 'fixture-token' } }, error: null });
document.querySelector('#start').onclick = async () => {
  const status = document.querySelector('#status');
  const bytes = new Uint8Array(13 * 1024 * 1024).fill(7);
  try {
    await uploadPostFile(new File([bytes], 'clip.MOV'), 'fixture/clip.mov', { onProgress: p => status.textContent = `Sending ${p}%` });
    status.textContent = 'PASS';
  } catch (e) { status.textContent = `FAIL ${e.message}`; }
};
</script></body></html>

name: Public profile links
on:
  pull_request:
    paths: ['src/pages/PublicProfile*', 'src/pages/Profile.tsx', 'src/components/profile/ProfileEditSheet.tsx', 'src/hooks/useAuth.tsx', 'supabase/migrations/*normalize_public_profile_lookup.sql', 'tests/public-profile/**', '.github/workflows/public-profile.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/public-profile/*.test.mjs
      - run: npm test -- src/pages/PublicProfile.test.tsx src/hooks/useAuth.revocation.test.tsx src/test/integration/auth.test.tsx
      - run: npx tsc --noEmit -p tsconfig.app.json

name: Ten-language interface
on:
  pull_request:
    paths:
      - 'src/i18n/**'
      - 'src/lib/invite-delivery*'
      - 'src/lib/invitation-email-copy*'
      - 'supabase/functions/_shared/invitation-*'
      - 'supabase/functions/send-user-invitation/**'
      - 'supabase/functions/send-mvp-candidate-invitation/**'
      - '.github/workflows/interface-translations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=3
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

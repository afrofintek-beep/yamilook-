name: Invitation registration tests

on:
  pull_request:
    paths:
      - "src/components/auth/RegisterForm.tsx"
      - "src/lib/invitation-registration.ts"
      - "src/lib/invitation-registration.test.ts"
      - "src/lib/referral.ts"
      - "src/lib/referral.test.ts"
      - "src/lib/invite-delivery.ts"
      - "src/lib/invite-delivery.test.ts"
      - "src/lib/public-site.ts"
      - "src/lib/public-site.test.ts"
      - "src/hooks/useAuth.tsx"
      - "src/pages/ForgotPassword.tsx"
      - "src/pages/Register*"
      - "src/components/admin/TrustedInvitesPanel*"
      - "src/components/admin/CampaignHub*"
      - "src/components/admin/FounderInviteAssistant.tsx"
      - "src/components/auth/LoginForm*"
      - "src/features/papos/PaposLogin.tsx"
      - "src/features/trusted-invites/**"
      - "src/lib/trusted-account-login*"
      - "src/test/integration/auth.test.tsx"
      - "src/test/integration/auth-hook.test.tsx"
      - "supabase/functions/send-user-invitation/**"
      - "supabase/functions/trusted-invitations/**"
      - "supabase/config.toml"
      - "src/components/settings/InviteSheet.tsx"
      - "src/components/settings/InviteSheet.test.tsx"
      - "src/components/settings/ContactInviteActions*"
      - "supabase/migrations/*_shareable_contact_invitations.sql"
      - "scripts/test-contact-invitations.mjs"
      - "supabase/migrations/*_trusted_invitations.sql"
      - "scripts/test-trusted-invitations.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/invitation-registration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invitation-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- src/lib/public-site.test.ts src/lib/invitation-registration.test.ts src/lib/referral.test.ts src/lib/invite-delivery.test.ts src/components/settings/InviteSheet.test.tsx src/components/settings/ContactInviteActions.test.tsx src/test/integration/auth.test.tsx --reporter=dot
      - run: node --test scripts/test-contact-invitations.mjs
      - run: npm test -- src/lib/trusted-account-login.test.ts src/features/trusted-invites src/components/admin/TrustedInvitesPanel.test.tsx src/components/admin/CampaignHub.test.tsx src/components/auth/LoginForm.trusted.test.tsx src/pages/Register.test.tsx src/test/integration/auth-hook.test.tsx --reporter=dot
      - run: node --test scripts/test-trusted-invitations.mjs

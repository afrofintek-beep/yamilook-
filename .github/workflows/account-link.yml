name: Account link boundary
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/account-link/**'
      - 'src/components/account-link/**'
      - 'src/pages/Settings.tsx'
      - 'src/features/papos/PaposSettings.tsx'
      - 'package*.json'
      - '.github/workflows/account-link.yml'
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:account-link
      - run: npx vitest run src/components/account-link/AccountPhoneConfirmation.test.tsx
      - run: npm run build

name: Real Supabase Auth staging multi-session test
on:
  push:
    branches: [test/actual-supabase-multisession-20261027]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TEST_SUPABASE_URL: https://gknrgphlirztezkavrbd.supabase.co
      # Client-visible publishable key of a disposable test project; not a service_role secret.
      TEST_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_XtGDFJ4ohSpX2KDqwr1xhA_kF9fvclj'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real GoTrue login, alerts, revocation, renewed login and local logout
        run: node scripts/real-supabase-multisession-e2e.mjs

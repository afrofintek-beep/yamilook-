name: Angola beta admissions
on:
  pull_request:
    paths:
      - 'src/features/angola-beta/**'
      - 'src/pages/Onboarding*'
      - 'supabase/migrations/*_angola_10000_banda_invites.sql'
      - 'tests/angola-beta/**'
      - '.github/workflows/angola-beta.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/angola-beta/database.test.mjs
      - run: npx vitest run src/features/angola-beta/AngolaBeta.test.tsx src/components/settings/InviteSheet.test.tsx src/pages/Onboarding.confirmation.test.tsx src/pages/Onboarding.language.test.tsx
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build

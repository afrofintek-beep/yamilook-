name: Mentor governance
on:
  pull_request:
    paths:
      - 'src/features/academia/**'
      - 'src/pages/AdminMentors*'
      - 'supabase/migrations/*academia_mentor_governance.sql'
      - 'scripts/test-mentor-governance.mjs'
      - '.github/workflows/mentor-governance.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/test-mentor-governance.mjs
      - run: npx vitest run src/features/academia src/pages/AdminMentors.test.tsx
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm run build
